# Rebuilds Data/Terrain.lua and Data/Roads.lua from the latest WoW Forever release of AzerothGPS
# on CurseForge (tools/build_nav_data.py), weekly or on demand, and commits them to main when
# they changed. No tag: releasing stays a deliberate step.
name: Travel data

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build from AzerothGPS on CurseForge
        run: python -I tools/build_nav_data.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- Data; then
            echo "Travel data unchanged."
            exit 0
          fi
          SRC=$(head -1 Data/Roads.lua | sed -n 's/.*from AzerothGPS \([^ ]*\).*/\1/p')
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add Data
          git commit -m "Travel data from AzerothGPS ${SRC}"
          git push
